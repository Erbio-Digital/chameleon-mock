name: catalog-update
# Run after the connector packages are published and validated on nuget.org.
on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Comma-separated Id@version with the exact package id casing, e.g. Chameleon.Mock.Connectors.Pix@0.1.0'
        required: true
permissions:
  contents: read
jobs:
  # Runs the connectors' code (contract smoke) with a read-only token and no write credential.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Rebuild the entries from nuget.org
        env: { PACKAGES: '${{ inputs.packages }}' }
        run: |
          dotnet run -c Release --project tools/catalog -- --from-sources https://api.nuget.org/v3/index.json \
            --packages "$PACKAGES" --providers catalog/providers --merge catalog/connectors.json
      - name: Verify the updated catalog against nuget.org
        run: |
          dotnet build -c Release src/Chameleon.Host
          dotnet run -c Release --project tools/catalog-verify -- \
            --catalog catalog/connectors.json --sources https://api.nuget.org/v3/index.json \
            --providers catalog/providers --host src/Chameleon.Host/bin/Release/net8.0/Chameleon.Host.dll
      - uses: actions/upload-artifact@v4
        with: { name: catalog, path: catalog/connectors.json, retention-days: 1 }
  # Fresh runner: never executes connector code; only commits the verified JSON and opens the PR.
  pull-request:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: catalog, path: verified }
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES: '${{ inputs.packages }}'
        run: |
          jq -e 'type == "array"' verified/connectors.json > /dev/null
          cp verified/connectors.json catalog/connectors.json
          if git diff --quiet catalog/connectors.json; then echo "no change"; exit 0; fi
          branch="catalog/update-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "catalog: $PACKAGES" -- catalog/connectors.json
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          gh pr create --head "$branch" --title "catalog: $PACKAGES" --body "Entries rebuilt from nuget.org. They passed catalog-verify in this run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. A maintainer still reviews the source before merge."
